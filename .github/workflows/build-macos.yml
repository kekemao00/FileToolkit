name: Build macOS Release

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Target architecture"
        required: true
        default: "arm64"
        type: choice
        options:
          - arm64
          - x86_64
          - universal
      create_release:
        description: "Create a GitHub Release after build"
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-macos.yml"
      - "file-toolkit/**"

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      MACOS_ARCH: ${{ github.event.inputs.arch || 'arm64' }}
      FLET_CLI_NO_RICH_OUTPUT: "1"
    defaults:
      run:
        working-directory: file-toolkit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "file-toolkit/uv.lock"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: stable
          cache: true

      - name: Ensure macOS build tools
        run: |
          xcodebuild -version
          flutter --version
          flutter config --no-analytics
          flutter precache --macos
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods -v ">=1.16,<2.0"
          fi
          pod --version

      - name: Install dependencies
        run: |
          uv sync --all-extras
          uv pip install "flet-cli==0.84.0"

      - name: Build macOS app
        run: uv run bash build/build_macos.sh

      - name: Zip app bundle
        run: |
          app_path="$(find build/macos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "No .app bundle found in build/macos"
            find build/macos -maxdepth 3 -print
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app_path" \
            "../FileToolkit-macos-${MACOS_ARCH}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileToolkit-macos-${{ env.MACOS_ARCH }}
          path: FileToolkit-macos-${{ env.MACOS_ARCH }}.zip
          if-no-files-found: error

      - name: Generate version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=v0.0.0-${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT
            echo "release_name=Preview macOS build $(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          else
            echo "tag=v$(date +'%Y.%m.%d')-macos-${MACOS_ARCH}" >> $GITHUB_OUTPUT
            echo "release_name=FileToolkit macOS $(date +'%Y.%m.%d') (${MACOS_ARCH})" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: >-
          (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
          || github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.release_name }}
          body: |
            **FileToolkit** macOS build
            - Architecture: `${{ env.MACOS_ARCH }}`
            - Built from: `${{ github.sha }}`
            - Flutter: 3.41.4
          files: |
            FileToolkit-macos-${{ env.MACOS_ARCH }}.zip
          draft: false
          prerelease: ${{ github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
