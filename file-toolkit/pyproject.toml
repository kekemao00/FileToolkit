[project]
name = "file-toolkit"
version = "1.5.0"
description = "File Toolkit — Local file processing desktop application"
readme = { text = "File Toolkit — Local file processing desktop application", content-type = "text/plain" }
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "kekemao00" },
]

dependencies = [
    "flet==0.84.0",  # 与 flet-cli 版本保持一致；打包时按此版本安装进应用
    "pypdf>=4.0,<5.0",
    "pikepdf>=9.0,<10.0",
    "pdf2docx>=0.5.13,<0.6.0",
    "pypdfium2>=5.14.0,<6",  # PDF 渲染（转图片、转 PPT、扫描件 OCR）
    "Pillow>=10.0,<11.0",
    "pillow-heif>=0.16,<1.0",
    "py7zr>=0.21,<0.22",
    "rarfile>=4.5,<5.0",
    "httpx>=0.27,<1.0",
    "pdfplumber>=0.10,<1.0",
    "openpyxl>=3.1,<4.0",
    "python-pptx>=0.6,<1.0",
    "reportlab>=4.0,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 这是 Flet 应用，不作为 Python 包分发
# 明确指定包含的目录，避免 hatchling 自动检测失败
packages = ["core", "services", "ui"]

[tool.uv]
constraint-dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "mypy>=1.10",
]
# 打包工具：`uv sync --group build` 后执行 `uv run flet build <平台>`
build = [
    "flet-cli==0.84.0",
]

# ── flet build 打包配置（本地与 CI 共用，命令行参数可覆盖）──────────
# 版本号取自 [project].version，发布时 tag 必须与之一致（vX.Y.Z）
[tool.flet]
product = "File Toolkit"
artifact = "FileToolkit"
org = "com.kekemao00"
bundle_id = "com.kekemao00.filetoolkit"
company = "FileToolkit"
copyright = "Copyright (c) 2026 kekemao00. Apache License 2.0."

[tool.flet.app]
# 不打进安装包的文件（build/ 由 flet 默认排除）
# 应用图标由 flet build 自动读取 assets/icon.png（默认）和 assets/icon_macos.png，
# 改图标后运行 packaging/icon/generate_icons.py 重新生成
exclude = [
    ".venv",
    ".data",
    "tests",
    "packaging",
    "uv.lock",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
